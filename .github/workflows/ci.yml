name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Smoke test
        run: |
          php -S 127.0.0.1:8080 > /tmp/php-server.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8080/ -o /tmp/home.html
          grep -q '<title>' /tmp/home.html
          kill $!
